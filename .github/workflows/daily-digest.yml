name: Daily Agents Radar

on:
  # Paid Qwen workflow: manual-only until DASHSCOPE_API_KEY is configured.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# A late scheduled run must not overlap a manual catch-up run: both would build
# the same CST day's digest and open a duplicate set of issues (as happened on
# 2026-08-27, which produced 18 duplicates). Queue rather than cancel, so the
# scheduled run reaches the guard job below only after the manual one has
# committed its digest — and then skips.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Skip a scheduled run when today's digest already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event is ${{ github.event_name }} — manual runs always proceed."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if gh api "repos/${{ github.repository }}/contents/digests/$DATE" --silent 2>/dev/null; then
            echo "digests/$DATE is already committed — a manual run covered today. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No digests/$DATE yet — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching 50 articles) may need up to 20 min.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: qwen
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm start

      - name: Commit digest files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            git commit -m "digest: ${DATE} daily digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        run: pnpm manifest

      - name: Commit manifest and feed
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
          PAGES_URL: https://duanyytop.github.io/agents-radar
        run: pnpm notify

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          PAGES_URL: https://duanyytop.github.io/agents-radar
        run: pnpm notify:feishu

      - name: Close stale issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale

