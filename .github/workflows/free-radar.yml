name: Free Firsthand Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * *' # 07:17 Beijing time

permissions:
  contents: write

concurrency:
  group: free-firsthand-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect candidate links without AI API keys
        run: python scripts/free_radar.py
      - name: Commit daily radar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar/
          if ! git diff --cached --quiet; then
            git commit -m 'radar: daily free firsthand sources'
            git pull --rebase
            git push
          fi
